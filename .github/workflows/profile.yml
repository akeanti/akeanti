name: live profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_profile.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild header, pinned cards, stats and the README pinned block
        run: python3 .github/scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if something changed
        run: |
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Profile unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live profile"
          git push
