name: live profile

# Tests the builder offline, then rebuilds the profile from the GitHub API and my other repos, checks
# it, screenshots it at desktop and phone width, and publishes it only if something changed.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-profile]  # lets another repo's release workflow ask for a rebuild right away
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "README.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: live-profile-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the builder offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests, an offline build from the fixture, and the README checks
        run: python3 -m unittest discover -s .github/tests -v

  rebuild:
    name: Rebuild and publish
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch, build and check
        run: >-
          python3 .github/scripts/build_profile.py
          --save "$RUNNER_TEMP/github.json"
          --preview preview/index.html
          --summary "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Screenshot the result at desktop and phone width
        if: always()
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ] || [ ! -f preview/index.html ]; then
            echo "::notice::No browser or no preview, so no screenshots this run."
            exit 0
          fi
          shot() {
            "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 \
              --window-size="$1" --screenshot="$PWD/preview/$2.png" "file://$PWD/preview/$3"
          }
          shot 940,7800 desktop index.html
          shot 520,5600 phone phone.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-preview
          path: preview/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit and push, rebuilding on top if main moved meanwhile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          data="$RUNNER_TEMP/github.json"
          [ -f "$data" ] || data=.github/data/github.json
          for attempt in 1 2 3; do
            git add -A assets README.md .github/data
            if git diff --cached --quiet; then
              echo "Profile unchanged."
              exit 0
            fi
            changes=$(git diff --cached --name-only | sed 's/^/- /')
            git commit -q -m "Refresh live profile" -m "$changes"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main moved during the run; rebuilding on top of it ($attempt/3)."
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/scripts/build_profile.py --data "$data"
          done
          exit 1
