<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Akeanti — Electrical and Energy Engineering, AI for Industrial Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#13293d"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1793D1" opacity="0.10"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      .trace   { stroke:#1793D1; stroke-width:2; fill:none; opacity:0.55; }
      .traceR  { stroke:#3a4a5c; stroke-width:2; fill:none; opacity:0.65; }
      .via     { fill:#1793D1; opacity:0.8; }
      .viaR    { fill:#3a4a5c; opacity:0.85; }
      .title   { font-family:'JetBrains Mono','Fira Code',monospace; font-weight:700; fill:#f2f7fb; }
      .subtitle{ font-family:'JetBrains Mono','Fira Code',monospace; fill:#8fb8d6; }
      .meta    { font-family:'JetBrains Mono','Fira Code',monospace; fill:#5c7488; }
      .tag     { font-family:'JetBrains Mono',monospace; fill:#d7e6f0; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect width="900" height="220" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="#1793D1" stroke-opacity="0.25"/>

  <!-- background traces, right side -->
  <path class="traceR" d="M900,64 H800 L780,84 H660 L640,104"/>
  <path class="traceR" d="M900,168 H820 L800,148 H700"/>
  <circle class="viaR" cx="800" cy="64" r="4"/><circle class="viaR" cx="780" cy="84" r="4"/>
  <circle class="viaR" cx="640" cy="104" r="4"/><circle class="viaR" cx="820" cy="168" r="4"/>
  <circle class="viaR" cx="800" cy="148" r="4"/>

  <!-- animated traces spanning full width -->
  <path class="trace" d="M0,44 H150 L170,64 H380"/>
  <path class="trace" d="M0,192 H100 L120,172 H480 L500,152 H900"/>
  <circle class="via" cx="150" cy="44" r="4"/><circle class="via" cx="170" cy="64" r="4"/><circle class="via" cx="380" cy="64" r="4"/>
  <circle class="via" cx="100" cy="192" r="4"/><circle class="via" cx="120" cy="172" r="4"/>
  <circle class="via" cx="480" cy="172" r="4"/><circle class="via" cx="500" cy="152" r="4"/>

  <circle r="3.5" fill="#1793D1">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M0,44 H150 L170,64 H380"/>
  </circle>
  <circle r="3.5" fill="#ffb300">
    <animateMotion dur="4.4s" repeatCount="indefinite" path="M0,192 H100 L120,172 H480 L500,152 H900"/>
  </circle>

  <!-- title block -->
  <text x="60" y="102" class="title" font-size="44">AKEANTI</text>
  <text x="60" y="130" class="subtitle" font-size="15.5">Electrical &amp; Energy Engineering · AI for Industrial Systems</text>
  <text x="60" y="154" class="meta" font-size="11.5">GEE @ EHTP, Casablanca · CNC concours · ex-CPGE MP</text>

  <!-- status indicator -->
  <rect x="748" y="20" width="132" height="24" rx="12" fill="#101f30" stroke="#3ddc84" stroke-opacity="0.4"/>
  <circle cx="766" cy="32" r="5" fill="#3ddc84">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="780" y="36" class="tag" font-size="11.5">OPEN TO WORK</text>
</svg>
