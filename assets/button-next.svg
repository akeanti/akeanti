<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60" fill="none" role="img" aria-labelledby="title desc"><title id="title">What’s next</title><desc id="desc">What’s next link button.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.2px}
.mono{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:1.4px}
.tl{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:0}
.bold{font-weight:650;letter-spacing:-.4px}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.shimmer{animation:shimmer 12s ease-in-out infinite}@keyframes shimmer{0%,45%{transform:translateX(-340px);opacity:0}55%{opacity:.3}80%,100%{transform:translateX(340px);opacity:0}}
@media(prefers-reduced-motion:reduce){.shimmer,.pulse,.ring{animation:none!important}}
</style><clipPath id="bounds"><rect x="1" y="1" width="238" height="58" rx="13" fill="white"/></clipPath></defs><rect x="1" y="1" width="238" height="58" rx="13" fill="#202a25" stroke="#3b4a42"/><g clip-path="url(#bounds)">
<circle cx="31" cy="30" r="5" fill="#e0a84a" class="ring"/><circle cx="31" cy="30" r="5" fill="#e0a84a" class="pulse"/><circle cx="31" cy="30" r="9.5" stroke="#e0a84a" stroke-opacity=".45" stroke-dasharray="3 3"/><text x="58" y="37" font-size="18" class="bold" style="fill:#f4f0e5">What’s next</text><rect x="100" y="-15" width="23" height="100" fill="#ffffff" opacity=".06" transform="rotate(18 100 30)" class="shimmer"/>
</g></svg>
