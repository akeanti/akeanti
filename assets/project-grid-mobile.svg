<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" fill="none" role="img" aria-labelledby="title desc"><title id="title">cascade-gnn | Grid resilience</title><desc id="desc">Cascading grid failures using PowerGraph, PyTorch Geometric, XGBoost, GNNExplainer and Streamlit. Illustrative grid animation.</desc><defs><style>
