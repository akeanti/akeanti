<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="52" viewBox="0 0 1200 52" fill="none" role="img" aria-labelledby="title desc"><title id="title">Lab wire</title><desc id="desc">News ticker. Shipped: drpc v1.1.0 · Discord Rich Presence for MATLAB. Shipped: swingbus · power flow, N-1, DC-OPF · checked vs PYPOWER. On the bench: nabd · phasor + ROCOF firmware for GPS-synced nodes. Next: cascade-gnn on the official PowerGraph data. Open: summer 2027 internship · 1–2 months. Cooking: something new is on the bench · follow to catch it.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.7px}
.mono{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:1.4px}
.tl{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:0}
.bold{font-weight:650;letter-spacing:-.4px}
.flow{animation:flow 10s linear infinite}.flow-fast{animation:flow 6s linear infinite}.flow-slow{animation:flow 18s linear infinite reverse}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.orbit{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.ccw{animation:ccw 4s linear infinite}
.draw{animation:draw 1.2s cubic-bezier(.6,0,.2,1) .2s both;transform-box:fill-box;transform-origin:left}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
@keyframes draw{from{transform:scaleX(0)}}
.tick{animation:tick 86.21s linear infinite}@keyframes tick{to{transform:translateX(-3276.1px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
