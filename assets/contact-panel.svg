<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" fill="none" role="img" aria-labelledby="title desc"><title id="title">Open to internships</title><desc id="desc">Open to internships, stage and PFA in energy, industrial AI and OT cybersecurity. Morocco or abroad, on-site, hybrid or remote. Click the artwork to email Akeanti.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="1198" height="178" rx="20" fill="#1a1c1b" stroke="#374640" /><rect x="1" y="1" width="1198" height="178" rx="20" fill="url(#wash)" /><text x="32" y="63" font-size="39" class="title" >Open to internships.</text><text x="34" y="104" font-size="22" class="muted" >Energy · industrial AI · OT cybersecurity</text><text x="34" y="143" font-size="18" class="muted" >Stage / PFA · Morocco or abroad · on-site, hybrid or remote</text><rect x="913" y="55" width="250" height="66" rx="11" fill="#1a1c1b" stroke="#43b8c0" /><text x="940" y="97" font-size="22" class="mono teal" >LET’S TALK</text><path d="M1115 98l20-20m-15 0h15v15" fill="none" stroke="#43b8c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M812 137V90h76" fill="none" stroke="#374640" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M812 137V90h76" fill="none" stroke="#a3bf94" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 22" class="flow"/><circle cx="812" cy="137" r="4" fill="#a3bf94" class="pulse"/></svg>