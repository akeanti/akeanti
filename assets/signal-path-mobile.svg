<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" fill="none" role="img" aria-labelledby="title desc">
<title id="title">From measurement to decision</title>
<desc id="desc">Field, sense, model, explain and decide. Motor, grid and PEM signals; ESP32 and ADS1115; GNNs and XGBoost; SHAP and GNNExplainer; Streamlit early-warning views.</desc>
<defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}
.label{font-size:16px;font-weight:600;letter-spacing:2px}
.title{font-weight:700;letter-spacing:-.7px}
.flow{animation:flow 12s linear infinite}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.flow,.breathe{animation:none}}
</style></defs>
