<svg xmlns="http://www.w3.org/2000/svg" width="600" height="683" viewBox="0 0 600 683" fill="none" role="img" aria-labelledby="title desc"><title id="title">Signals, models and diagnostics</title><desc id="desc">Motors, grids and electrolyzers; ESP32 and ADS1115; GNNs and XGBoost; SHAP and GNNExplainer; Streamlit and early-warning views.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="598" height="681" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="28" y="43" font-size="30" class="title" >Signals → models</text><text x="28" y="82" font-size="30" class="title" >→ diagnostics</text><rect x="26" y="106" width="548" height="98" rx="12" fill="#202725" stroke="#374640" /><text x="43" y="134" font-size="16" class="mono sage" >01</text><g transform="translate(44 150) scale(1)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 2 8 18h10l-3 14 14-19H18Z"/></g><text x="105" y="142" font-size="28" class="title" >Field</text><text x="105" y="178" font-size="22" class="muted" >Motors · grids · Electrolyzers</text><path d="M300 207v9m-4-4 4 4 4-4" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="26" y="219" width="548" height="98" rx="12" fill="#202725" stroke="#374640" /><text x="43" y="247" font-size="16" class="mono sage" >02</text><g transform="translate(44 263) scale(1)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h7l4-11 7 20 5-14 3 5h5"/></g><text x="105" y="255" font-size="28" class="title" >Sense</text><text x="105" y="291" font-size="22" class="muted" >ESP32 · ADS1115</text><path d="M300 320v9m-4-4 4 4 4-4" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="26" y="332" width="548" height="98" rx="12" fill="#202725" stroke="#374640" /><text x="43" y="360" font-size="16" class="mono sage" >03</text><g transform="translate(44 376) scale(1)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 24 10-17 12 17H6m10-17v24"/><circle cx="6" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="28" cy="24" r="3"/></g><text x="105" y="368" font-size="28" class="title" >Model</text><text x="105" y="404" font-size="22" class="muted" >GNNs · XGBoost</text><path d="M300 433v9m-4-4 4 4 4-4" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="26" y="445" width="548" height="98" rx="12" fill="#202725" stroke="#374640" /><text x="43" y="473" font-size="16" class="mono sage" >04</text><g transform="translate(44 489) scale(1)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="m22 22 9 9M9 16v-3m5 3V9m5 7v-5"/></g><text x="105" y="481" font-size="28" class="title" >Explain</text><text x="105" y="517" font-size="22" class="muted" >SHAP · GNNExplainer</text><path d="M300 546v9m-4-4 4 4 4-4" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="26" y="558" width="548" height="98" rx="12" fill="#202725" stroke="#374640" /><text x="43" y="586" font-size="16" class="mono sage" >05</text><g transform="translate(44 602) scale(1)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="30" height="23" rx="3"/><path d="M10 32h14m-7-5v5M9 16l5 5 11-11"/></g><text x="105" y="594" font-size="28" class="title" >Review</text><text x="105" y="630" font-size="22" class="muted" >Streamlit · Early-warning views</text></svg>