<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="271" viewBox="0 0 1200 271" fill="none" role="img" aria-labelledby="title desc"><title id="title">From a measurement to a decision</title><desc id="desc">Measure with ESP32 and ADS1115. Model with GNNs and XGBoost. Compare baseline results. Explain with SHAP and GNNExplainer. Review in Streamlit.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.7px}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.4px}
.bold{font-weight:650;letter-spacing:-.7px}
.flow{animation:flow 10s linear infinite}.flow-slow{animation:flow 18s linear infinite reverse}
.orbit{animation:orbit 30s linear infinite;transform-box:fill-box;transform-origin:center}
.counter{animation:orbit 42s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.float{animation:float 7s ease-in-out infinite}.lift{animation:lift 9s ease-in-out infinite}
.pulse{animation:pulse 5s ease-in-out infinite}.pulse-late{animation:pulse 6s ease-in-out 2s infinite}
.shimmer{animation:shimmer 12s ease-in-out infinite}.rise{animation:rise 8s linear infinite}
.ring{animation:ring 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes lift{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-12px)}}
@keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
@keyframes shimmer{0%,45%{transform:translateX(-340px);opacity:0}55%{opacity:.25}80%,100%{transform:translateX(340px);opacity:0}}
@keyframes rise{0%{transform:translateY(8px);opacity:.25}60%{opacity:.8}100%{transform:translateY(-23px);opacity:.1}}
@keyframes ring{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.09);opacity:.85}}
@media(prefers-reduced-motion:reduce){.flow,.flow-slow,.orbit,.counter,.float,.lift,.pulse,.pulse-late,.shimmer,.rise,.ring{animation:none!important}}

.scan{animation:scan 7s linear infinite}.rock{animation:rock 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rotor{animation:orbit 18s linear infinite;transform-origin:0px 0px}
.drift{animation:drift 11s ease-in-out infinite}.dash{animation:flow 7s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(204px)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.scan,.rock,.rotor,.drift,.dash{animation:none!important}}
</style><clipPath id="bounds"><rect x="1" y="1" width="1198" height="269" rx="24" fill="white" /></clipPath></defs><rect x="1" y="1" width="1198" height="269" rx="24" fill="#181e1c" stroke="#3b4a42" /><g clip-path="url(#bounds)"><text x="34" y="58" font-size="35" class="serif" style="fill:#f4f0e5" >From a measurement to a decision.</text><text x="34" y="107" font-size="15" class="mono" style="fill:#b7cd91" >01</text><text x="34" y="164" font-size="29" class="serif" style="fill:#f4f0e5" >Measure</text><text x="34" y="201" font-size="17" class="" style="fill:#b8c5b9" >ESP32 · ADS1115</text><g transform="translate(236 128) scale(0.65)" ><path d="M0 20 20 0M4 0h16v16" fill="none" stroke="#48bfc4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="42" cy="237" r="4" fill="#b7cd91" /><text x="267" y="107" font-size="15" class="mono" style="fill:#b7cd91" >02</text><text x="267" y="164" font-size="29" class="serif" style="fill:#f4f0e5" >Model</text><text x="267" y="201" font-size="17" class="" style="fill:#b8c5b9" >GNNs · XGBoost</text><g transform="translate(469 128) scale(0.65)" ><path d="M0 20 20 0M4 0h16v16" fill="none" stroke="#48bfc4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="275" cy="237" r="4" fill="#b7cd91" /><text x="500" y="107" font-size="15" class="mono" style="fill:#b7cd91" >03</text><text x="500" y="164" font-size="29" class="serif" style="fill:#f4f0e5" >Compare</text><text x="500" y="201" font-size="17" class="" style="fill:#b8c5b9" >Baseline results</text><g transform="translate(702 128) scale(0.65)" ><path d="M0 20 20 0M4 0h16v16" fill="none" stroke="#48bfc4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="508" cy="237" r="4" fill="#b7cd91" /><text x="733" y="107" font-size="15" class="mono" style="fill:#b7cd91" >04</text><text x="733" y="164" font-size="29" class="serif" style="fill:#f4f0e5" >Explain</text><text x="733" y="201" font-size="17" class="" style="fill:#b8c5b9" >SHAP · GNNExplainer</text><g transform="translate(935 128) scale(0.65)" ><path d="M0 20 20 0M4 0h16v16" fill="none" stroke="#48bfc4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="741" cy="237" r="4" fill="#b7cd91" /><text x="966" y="107" font-size="15" class="mono" style="fill:#b7cd91" >05</text><text x="966" y="164" font-size="29" class="serif" style="fill:#f4f0e5" >Review</text><text x="966" y="201" font-size="17" class="" style="fill:#b8c5b9" >Streamlit</text><circle cx="974" cy="237" r="4" fill="#b7cd91" /><path d="M42 237h1100" fill="none" stroke="#3b4a42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 237h1100" fill="none" stroke="#48bfc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15 105" class="flow"/></g></svg>