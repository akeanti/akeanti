<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="t d"><title id="t">Contact</title><desc id="d">Hiring a first-year engineering intern? Stage d&#x27;initiation. My CV has it all on one page, in French. When: Summer 2027, 1 to 2 months, dates on request. Where: Morocco or abroad, on-site, hybrid or remote. Fields: Power and energy systems, studies, operations, maintenance, automation. Email: essamit.elmehdi@proton.me, or linkedin.com/in/elmehdi-essamit. Web: elmehdi-essamit.com, portfolio. Click to download my CV.</desc><defs><style>
