<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none" role="img" aria-labelledby="t d"><title id="t">Let&#x27;s work together</title><desc id="d">Hiring a first-year engineering intern? Stage de 1re année, summer 2027. When: Summer 2027, 1–2 months · dates on request. Where: Morocco or abroad, on-site, hybrid or remote. Fields: Power &amp; energy systems, embedded · industrial AI · OT security. School: EHTP · first year, GEE, after CPGE MP and the CNC. Languages: Arabic · French · English, native · fluent · professional. Contact: akeantie@gmail.com, CV on request. Click to request my CV.</desc><defs><style>
