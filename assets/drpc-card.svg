<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none" role="img" aria-labelledby="title desc"><title id="title">drpc | Discord Rich Presence for MATLAB</title><desc id="desc">Side quest, shipped v1.1.0: drpc, Discord Rich Presence for MATLAB. The animated card cycles through what it shows on Discord: Editing pid_controller.m, line 42 of 142; Running sweep_bode.m; Simulating motor_model in Simulink, 45 percent done; Debugging kalman_step.m, paused at line 87. Runs inside MATLAB with no Python or Node helper, a watchdog thread notices long-running code, and the C# bridge is compiled on your PC.</desc><defs><style>
