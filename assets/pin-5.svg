<svg xmlns="http://www.w3.org/2000/svg" width="520" height="354" viewBox="0 0 520 354" fill="none" role="img" aria-labelledby="t d"><title id="t">ariadne</title><desc id="d">ariadne, robotics and control. Simulation-first ESP32 micromouse: clothoid turn synthesis, time-optimal planning and a 10 kHz physics model running the real firmware control law. Key numbers: 2.4× faster than stop-and-pivot; 115 automated tests in CI. Release: v3.0.0. Tests passing. MIT license, updated 13 Oct 2026.</desc><defs><style>
