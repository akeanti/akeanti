troke-opacity=".6"/><rect x="26" y="216" width="568" height="130" rx="13" fill="#202725" stroke="#374640" /><g transform="translate(44 233) scale(0.8)" fill="none" stroke="#d5bd8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="18" height="18" rx="3"/><path d="M13 2v6m8-6v6M13 26v6m8-6v6M2 13h6m-6 8h6m18-8h6m-6 8h6"/></g><text x="86" y="252" font-size="17" class="mono" style="fill:#d5bd8f" >EMBEDDED &amp; SECURITY</text><text x="46" y="293" font-size="22" class="" >ESP32 · Arduino · ADS1115</text><text x="46" y="324" font-size="21" class="muted" >SCADA · Nmap · Wireshark</text><path d="M44 346H574" fill="none" stroke="#d5bd8f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22 508" class="flow2" stroke-opacity=".6"/><rect x="606" y="216" width="568" height="130" rx="13" fill="#202725" stroke="#374640" /><g transform="translate(624 233) scale(0.8)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m11 8-8 9 8 9m12-18 8 9-8 9M20 3l-6 28"/></g><text x="666" y="252" font-size="17" class="mono" style="fill:#43b8c0" >BUILD &amp; COMMUNICATE</text><text x="626" y="293" font-size="22" class="" >Python · Git · Linux · Streamlit</text><text x="626" y="324" font-size="21" class="muted" >LaTeX · VS Code</text><path d="M624 346H1154" fill="none" stroke="#43b8c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22 508" class="flow2" stroke-opacity=".6"/></svg>