<title id="title">Tools and methods</title>
<desc id="desc">Power and energy: MCSA, pvlib, resonant coupling, BMS fundamentals and energy modelling. AI: PyTorch Geometric, XGBoost, SHAP, Optuna and pandas. Embedded and OT: ESP32, Arduino, ADS1115, SCADA, Nmap and Wireshark. Tools: Python, Git, Linux, Streamlit, LaTeX and VS Code.</desc>
