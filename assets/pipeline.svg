<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none" role="img" aria-labelledby="title desc"><title id="title">Inside cascade-gnn</title><desc id="desc">The cascade-gnn v0.3 pipeline in eight stages: 1 ingest PowerGraph binary and four-class targets; 2 audit the data contract, contingencies and file hashes; 3 split three ways (random, operating-condition, contingency); 4 guard against leakage between grouped holdouts; 5 train five GNN variants against XGBoost on the same saved split; 6 calibrate with temperature scaling (ECE, Brier, log loss); 7 explain with edge attributions checked against the simulated cascade; 8 report repeated runs with manifests and a Streamlit demo.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.2px}
.mono{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:1.4px}
.tl{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:0}
.bold{font-weight:650;letter-spacing:-.4px}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.packets{stroke-dasharray:8 22;animation:packets 1s linear infinite}@keyframes packets{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes stage{0%{opacity:.18}5%{opacity:1}14%{opacity:1}24%,100%{opacity:.18}}
.st0{animation:stage 6.4s linear 0s infinite}.st1{animation:stage 6.4s linear 0.8s infinite}.st2{animation:stage 6.4s linear 1.6s infinite}.st3{animation:stage 6.4s linear 2.4s infinite}.st4{animation:stage 6.4s linear 3.2s infinite}.st5{animation:stage 6.4s linear 4s infinite}.st6{animation:stage 6.4s linear 4.8s infinite}.st7{animation:stage 6.4s linear 5.6s infinite}
@media(prefers-reduced-motion:reduce){.packets,[class^=st],.pulse{animation:none!important}}
</style><clipPath id="bounds"><rect x="1" y="1" width="1198" height="428" rx="24" fill="white"/></clipPath></defs><rect x="1" y="1" width="1198" height="428" rx="24" fill="#181e1c" stroke="#3b4a42"/><g clip-path="url(#bounds)">
<text x="34" y="60" font-size="36" class="serif" style="letter-spacing:-1.7px">Inside cascade-gnn.</text><circle cx="1014" cy="49" r="4" fill="#48bfc4" class="pulse"/><text x="1166" y="54" font-size="14" class="mono" text-anchor="end" style="fill:#b7cd91">PIPELINE · v0.3</text>
