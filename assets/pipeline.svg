<rect x="34" y="96" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="48" y="96" width="234" height="3" rx="1.5" fill="#48bfc4" class="st0"/><text x="52" y="126" font-size="12" class="mono" style="fill:#b7cd91">01 · INGEST</text><text x="52" y="158" font-size="22" class="serif">PowerGraph import</text><text x="52" y="184" font-size="14" style="fill:#b8c5b9">binary + 4-class targets</text><rect x="326" y="96" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="340" y="96" width="234" height="3" rx="1.5" fill="#48bfc4" class="st1"/><text x="344" y="126" font-size="12" class="mono" style="fill:#b7cd91">02 · AUDIT</text><text x="344" y="158" font-size="22" class="serif">Data contract</text><text x="344" y="184" font-size="14" style="fill:#b8c5b9">contingencies · file hashes</text><rect x="618" y="96" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="632" y="96" width="234" height="3" rx="1.5" fill="#48bfc4" class="st2"/><text x="636" y="126" font-size="12" class="mono" style="fill:#b7cd91">03 · SPLIT</text><text x="636" y="158" font-size="22" class="serif">3 split strategies</text><text x="636" y="184" font-size="14" style="fill:#b8c5b9">random · operating · contingency</text><rect x="910" y="96" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="924" y="96" width="234" height="3" rx="1.5" fill="#48bfc4" class="st3"/><text x="928" y="126" font-size="12" class="mono" style="fill:#b7cd91">04 · GUARD</text><text x="928" y="158" font-size="22" class="serif">Leakage checks</text><text x="928" y="184" font-size="14" style="fill:#b8c5b9">grouped holdouts stay disjoint</text><rect x="910" y="246" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="924" y="246" width="234" height="3" rx="1.5" fill="#48bfc4" class="st4"/><text x="928" y="276" font-size="12" class="mono" style="fill:#b7cd91">05 · TRAIN</text><text x="928" y="308" font-size="22" class="serif">5 GNNs vs XGBoost</text><text x="928" y="334" font-size="14" style="fill:#b8c5b9">on the same saved split</text><rect x="618" y="246" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="632" y="246" width="234" height="3" rx="1.5" fill="#48bfc4" class="st5"/><text x="636" y="276" font-size="12" class="mono" style="fill:#b7cd91">06 · CALIBRATE</text><text x="636" y="308" font-size="22" class="serif">Temperature scaling</text><text x="636" y="334" font-size="14" style="fill:#b8c5b9">ECE · Brier · log loss</text><rect x="326" y="246" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="340" y="246" width="234" height="3" rx="1.5" fill="#48bfc4" class="st6"/><text x="344" y="276" font-size="12" class="mono" style="fill:#b7cd91">07 · EXPLAIN</text><text x="344" y="308" font-size="22" class="serif">Edge attributions</text><text x="344" y="334" font-size="14" style="fill:#b8c5b9">checked vs simulated cascade</text><rect x="34" y="246" width="262" height="104" rx="14" fill="#202a25" stroke="#3b4a42"/><rect x="48" y="246" width="234" height="3" rx="1.5" fill="#48bfc4" class="st7"/><text x="52" y="276" font-size="12" class="mono" style="fill:#b7cd91">08 · REPORT</text><text x="52" y="308" font-size="22" class="serif">Repeated runs</text><text x="52" y="334" font-size="14" style="fill:#b8c5b9">manifests · Streamlit demo</text>
