<text x="968" y="138" font-size="16" class="mu">automated tests in CI</text>
<text x="968" y="159" font-size="16" class="mu">across 4 repos</text>
</g>
</g><rect x=".5" y=".5" width="1199" height="195" rx="19.5" stroke="#33413b"/></svg>
