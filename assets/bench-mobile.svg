<svg xmlns="http://www.w3.org/2000/svg" width="600" height="609" viewBox="0 0 600 609" fill="none" role="img" aria-labelledby="title desc"><title id="title">Wireless power and industrial monitoring</title><desc id="desc">Resonant WPT: 23 percent efficiency at 34 kHz. Model comparison against Yates: R squared 0.992. OT and SCADA anomaly-detection dashboard in development.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="598" height="607" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="30" y="45" font-size="31" class="title" >Bench notes</text><rect x="26" y="75" width="548" height="155" rx="13" fill="#202725" stroke="#374640" /><rect x="26" y="252" width="548" height="155" rx="13" fill="#202725" stroke="#374640" /><rect x="26" y="429" width="548" height="155" rx="13" fill="#202725" stroke="#374640" /><text x="48" y="110" font-size="18" class="mono teal" >RESONANT WPT</text><text x="47" y="170" font-size="58" class="title" >23%</text><text x="49" y="207" font-size="25" class="muted" >Efficiency at 34 kHz</text><g transform="translate(440 151) scale(1.05)"><ellipse cx="0" cy="0" rx="6.72" ry="16" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="0" cy="0" rx="9.24" ry="22" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="0" cy="0" rx="11.76" ry="28" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="6.72" ry="16" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="9.24" ry="22" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="11.76" ry="28" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><path d="M-15 0H72" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 16" class="flow"/><circle cx="29" cy="0" r="38" fill="none" stroke="#a3bf94" stroke-opacity=".2" stroke-dasharray="18 220" class="orbit"/></g><text x="48" y="287" font-size="18" class="mono sage" >MODEL COMPARISON</text><text x="47" y="347" font-size="58" class="title" >0.992</text><text x="49" y="385" font-size="24" class="muted" >R² against the Yates reference</text><text x="48" y="464" font-size="18" class="mono gold" >INDUSTRIAL MONITORING</text><text x="47" y="513" font-size="36" class="title" >OT / SCADA</text><text x="49" y="551" font-size="23" class="muted" >Anomaly dashboard in development</text><g transform="translate(490 490) scale(1.3)" fill="none" stroke="#d5bd8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="30" height="23" rx="3"/><path d="M10 32h14m-7-5v5M9 16l5 5 11-11"/></g></svg>