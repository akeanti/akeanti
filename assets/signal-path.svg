<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="313" viewBox="0 0 1200 313" fill="none" role="img" aria-labelledby="title desc">
<title id="title">From measurement to decision</title>
<desc id="desc">Field: motors, grids and PEM electrolyzers. Sense: ESP32, ADS1115 and signal acquisition. Model: GNNs, XGBoost and baseline comparison. Explain: SHAP and GNNExplainer. Decide: Streamlit and early-warning views. Iterate through measurement, comparison and inspection.</desc>
