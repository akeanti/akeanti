<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" fill="none" role="img" aria-labelledby="title desc"><title id="title">Signals, models and diagnostics</title><desc id="desc">Field: motors, grids and electrolyzers. Sense: ESP32 and ADS1115. Model: GNNs and XGBoost. Explain: SHAP and GNNExplainer. Review: Streamlit and early-warning views.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="1198" height="248" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="30" y="45" font-size="28" class="title" >Signals → models → diagnostics</text><rect x="28" y="77" width="211" height="139" rx="12" fill="#202725" stroke="#374640" /><text x="44" y="101" font-size="13" class="mono sage" >01</text><g transform="translate(191 88) scale(0.75)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 2 8 18h10l-3 14 14-19H18Z"/></g><text x="45" y="138" font-size="25" class="title" >Field</text><text x="45" y="172" font-size="18" class="muted" >Motors · grids</text><text x="45" y="199" font-size="18" class="muted" >Electrolyzers</text><path d="M242 146h15m-5-5 5 5-5 5" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="261" y="77" width="211" height="139" rx="12" fill="#202725" stroke="#374640" /><text x="277" y="101" font-size="13" class="mono sage" >02</text><g transform="translate(424 88) scale(0.75)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h7l4-11 7 20 5-14 3 5h5"/></g><text x="278" y="138" font-size="25" class="title" >Sense</text><text x="278" y="172" font-size="18" class="muted" >ESP32</text><text x="278" y="199" font-size="18" class="muted" >ADS1115</text><path d="M475 146h15m-5-5 5 5-5 5" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="494" y="77" width="211" height="139" rx="12" fill="#202725" stroke="#374640" /><text x="510" y="101" font-size="13" class="mono sage" >03</text><g transform="translate(657 88) scale(0.75)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 24 10-17 12 17H6m10-17v24"/><circle cx="6" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="28" cy="24" r="3"/></g><text x="511" y="138" font-size="25" class="title" >Model</text><text x="511" y="172" font-size="18" class="muted" >GNNs</text><text x="511" y="199" font-size="18" class="muted" >XGBoost</text><path d="M708 146h15m-5-5 5 5-5 5" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="727" y="77" width="211" height="139" rx="12" fill="#202725" stroke="#374640" /><text x="743" y="101" font-size="13" class="mono sage" >04</text><g transform="translate(890 88) scale(0.75)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="m22 22 9 9M9 16v-3m5 3V9m5 7v-5"/></g><text x="744" y="138" font-size="25" class="title" >Explain</text><text x="744" y="172" font-size="18" class="muted" >SHAP</text><text x="744" y="199" font-size="18" class="muted" >GNNExplainer</text><path d="M941 146h15m-5-5 5 5-5 5" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="960" y="77" width="211" height="139" rx="12" fill="#202725" stroke="#374640" /><text x="976" y="101" font-size="13" class="mono sage" >05</text><g transform="translate(1123 88) scale(0.75)" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="30" height="23" rx="3"/><path d="M10 32h14m-7-5v5M9 16l5 5 11-11"/></g><text x="977" y="138" font-size="25" class="title" >Review</text><text x="977" y="172" font-size="18" class="muted" >Streamlit</text><text x="977" y="199" font-size="18" class="muted" >Early-warning views</text><path d="M45 230H1154" fill="none" stroke="#374640" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M45 230H1154" fill="none" stroke="#43b8c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 106" class="flow"/></svg>