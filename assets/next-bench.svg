<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc"><title id="title">Next on the bench</title><desc id="desc">Status board. Shipped in August 2026: cascade-gnn v0.3 with 14 tests in CI, Docker, a claim ledger and a LaTeX write-up. On the bench: an OT / SCADA anomaly-detection dashboard, in progress. Next milestone: running cascade-gnn on the official PowerGraph data. Under wraps: something new is cooking; reveal soon, follow to catch it first.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
