.scan{animation:scan 3.4s ease-in-out infinite}@keyframes scan{0%{transform:translateX(0)}70%,100%{transform:translateX(320px)}}
@media(prefers-reduced-motion:reduce){.march,.spin,.blink,.runner,.scan,.ring,.pulse{animation:none!important}}
