<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" fill="none" role="img" aria-labelledby="t d"><title id="t">drpc</title><desc id="d">drpc: Discord Rich Presence for MATLAB and Simulink: shows what you are editing, running, debugging or simulating. Runs inside MATLAB, no Python or Node. Key numbers: 9 activity states detected; 1 line install from MATLAB. Status: v1.1.0. CI success. 1 stars, updated 11 Oct 2026.</desc><defs><style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#f4f0e5}
