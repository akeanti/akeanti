<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" fill="none" role="img" aria-labelledby="t d"><title id="t">nabd</title><desc id="d">nabd: Open network of GPS-synchronized ESP32-S3 nodes measuring grid frequency, ROCOF and synchrophasors (IEEE C37.118), with a live map and open data. Key numbers: $59 per node, bill of materials; C37.118 IEEE synchrophasor format. Status: PRE-RELEASE. CI success. 1 stars, updated 14 Oct 2026.</desc><defs><style>
