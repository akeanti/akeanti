<svg xmlns="http://www.w3.org/2000/svg" width="600" height="563" viewBox="0 0 600 563" fill="none" role="img" aria-labelledby="title desc"><title id="title">Education and projects</title><desc id="desc">CPGE MP. TIPE wireless power transfer. CNC and EHTP electrical and energy engineering. Applied AI for grid and PEM diagnostics.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="598" height="561" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="28" y="44" font-size="31" class="title" >Education &amp; projects</text><line x1="46" y1="109" x2="46" y2="506" stroke="#374640" stroke-width="2" /><circle cx="46" cy="110" r="7" fill="#1a1c1b" stroke="#43b8c0" stroke-width="2"/><text x="79" y="102" font-size="17" class="mono sage" >01 / FOUNDATIONS</text><text x="79" y="142" font-size="32" class="title" >CPGE MP</text><text x="79" y="179" font-size="23" class="muted" >Mathematics &amp; physics</text><circle cx="46" cy="229" r="7" fill="#1a1c1b" stroke="#43b8c0" stroke-width="2"/><text x="79" y="221" font-size="17" class="mono sage" >02 / EXPERIMENTS</text><text x="79" y="261" font-size="32" class="title" >TIPE · WPT</text><text x="79" y="298" font-size="23" class="muted" >Resonant power transfer</text><circle cx="46" cy="348" r="7" fill="#1a1c1b" stroke="#43b8c0" stroke-width="2"/><text x="79" y="340" font-size="17" class="mono sage" >03 / ENGINEERING</text><text x="79" y="380" font-size="32" class="title" >CNC → EHTP</text><text x="79" y="417" font-size="23" class="muted" >Electrical &amp; energy systems</text><circle cx="46" cy="467" r="7" fill="#1a1c1b" stroke="#43b8c0" stroke-width="2"/><text x="79" y="459" font-size="17" class="mono sage" >04 / FOCUS</text><text x="79" y="499" font-size="32" class="title" >Applied AI</text><text x="79" y="536" font-size="23" class="muted" >Grid &amp; PEM diagnostics</text></svg>