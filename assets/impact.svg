<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title desc"><title id="title">Evidence, not adjectives.</title><desc id="desc">Evidence, not adjectives. swingbus agrees with PYPOWER to 1e-13 pu on the IEEE 14 to 300-bus systems; screens all 186 N-1 outages of IEEE 118 in 8.3 ms; solves the 9,241-bus PEGASE grid with Newton-Raphson in 0.27 s. A nabd GPS-synced node costs about 59 US dollars in parts (tier A). TIPE wireless power transfer: 23 percent efficiency at 34 kHz, R squared 0.992 against the Yates reference. 109 automated tests: 95 in swingbus, 14 in cascade-gnn.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.7px}
.mono{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:1.4px}
.tl{font-family:Consolas,Liberation Mono,Menlo,monospace;letter-spacing:0}
.bold{font-weight:650;letter-spacing:-.4px}
.flow{animation:flow 10s linear infinite}.flow-fast{animation:flow 6s linear infinite}.flow-slow{animation:flow 18s linear infinite reverse}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.orbit{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.ccw{animation:ccw 4s linear infinite}
.draw{animation:draw 1.2s cubic-bezier(.6,0,.2,1) .2s both;transform-box:fill-box;transform-origin:left}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
@keyframes draw{from{transform:scaleX(0)}}
.num text{font-family:Georgia,Times New Roman,serif;font-size:64px;fill:#f4f0e5}
.roll{animation:roll 1.8s cubic-bezier(.3,0,.1,1) both}@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-800px)}}
.sweep{animation:sweep 9s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1520px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
