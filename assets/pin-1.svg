<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" fill="none" role="img" aria-labelledby="t d"><title id="t">cascade-gnn</title><desc id="d">cascade-gnn: Early warning for cascading grid failures: five graph neural networks against XGBoost on PowerGraph (NeurIPS 2024), with edge attributions you can check. Key numbers: 5 GNNs vs tuned XGBoost baselines; 3 splits leakage-checked evaluation. Status: v0.3. CI success. 2 stars, updated 26 Aug 2026.</desc><defs><style>
