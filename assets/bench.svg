<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" fill="none" role="img" aria-labelledby="title desc"><title id="title">Wireless power and industrial monitoring</title><desc id="desc">TIPE resonant wireless power transfer: 23 percent efficiency at 34 kHz, with R squared of 0.992 in a model comparison against the Yates reference. OT and SCADA anomaly-detection dashboard in development. Animated coil illustration.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="1198" height="236" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="28" y="40" font-size="27" class="title" >Bench notes</text><text x="1172" y="38" font-size="13" class="mono muted" text-anchor="end">03 / EXPERIMENTS</text><rect x="24" y="62" width="368" height="153" rx="12" fill="#202725" stroke="#374640" /><rect x="416" y="62" width="368" height="153" rx="12" fill="#202725" stroke="#374640" /><rect x="808" y="62" width="368" height="153" rx="12" fill="#202725" stroke="#374640" /><text x="46" y="91" font-size="14" class="mono teal" >RESONANT WPT</text><text x="44" y="150" font-size="55" class="title" >23%</text><text x="46" y="187" font-size="21" class="muted" >Efficiency at 34 kHz</text><g transform="translate(292 129) scale(0.8)"><ellipse cx="0" cy="0" rx="6.72" ry="16" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="0" cy="0" rx="9.24" ry="22" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="0" cy="0" rx="11.76" ry="28" fill="none" stroke="#43b8c0" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="6.72" ry="16" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="9.24" ry="22" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><ellipse cx="57" cy="0" rx="11.76" ry="28" fill="none" stroke="#a3bf94" stroke-opacity=".8" stroke-width="1.3"/><path d="M-15 0H72" fill="none" stroke="#43b8c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 16" class="flow"/><circle cx="29" cy="0" r="38" fill="none" stroke="#a3bf94" stroke-opacity=".2" stroke-dasharray="18 220" class="orbit"/></g><text x="438" y="91" font-size="14" class="mono sage" >MODEL COMPARISON</text><text x="436" y="150" font-size="53" class="title" >0.992</text><text x="438" y="187" font-size="19" class="muted" >R² against the Yates reference</text><path d="M438 199h300" fill="none" stroke="#a3bf94" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 112" class="flow2"/><text x="830" y="91" font-size="14" class="mono gold" >INDUSTRIAL MONITORING</text><text x="829" y="140" font-size="32" class="title" >OT / SCADA</text><text x="830" y="173" font-size="21" class="muted" >Anomaly detection</text><text x="830" y="199" font-size="16" class="muted" >Dashboard in development</text><g transform="translate(1116 118) scale(1.05)" fill="none" stroke="#d5bd8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="30" height="23" rx="3"/><path d="M10 32h14m-7-5v5M9 16l5 5 11-11"/></g></svg>