<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" fill="none" role="img" aria-labelledby="t d"><title id="t">Background</title><desc id="d">Background, drawn as a one-line diagram. 2024, Sefrou: Baccalauréat, Sciences Maths B, Mention Très Bien, Lycée Le Jasmin 2. 2024 to 2026, Meknès: CPGE, MP track, Lycée Omar Ibn Al Khattab, then admitted to EHTP via the CNC. 2026 to 2029, Casablanca: EHTP, Ingénieur d&#x27;État, Electrical and Energy Engineering, now in year 1 of 3. Next, summer 2027: Your team?, this slot is open. Roles held alongside: Sept 2024 to June 2026: Vice-president &amp; trainer, BeurdByte Builders club, CPGE. Trained students in C, Arduino, ESP and IoT, and coached them to a working prototype. Since Oct 2026: Visits &amp; Workshops unit, Club Electro-Power, EHTP. Member, organizing industrial visits and microcontroller workshops. Notes: CPGE: two-year prep for the engineering schools; CNC: national entrance exam to those schools; EHTP: École Hassania des Travaux Publics; Bac: Mention Très Bien is the top honours band.</desc><defs><style>
text{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#F6F6F4}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,Menlo,monospace}
.b{font-weight:600}.it{font-style:italic}.body{fill:#C8CDCA}.soft{fill:#8E9692}.faint{fill:#5C635F}
