<svg xmlns="http://www.w3.org/2000/svg" width="520" height="354" viewBox="0 0 520 354" fill="none" role="img" aria-labelledby="t d"><title id="t">malfoid, live spellbook</title><desc id="d">malfoid, live spellbook: spells drawn one after another, each resampled to the 32 points the on-wand recognizer compares with dynamic time warping, then named: Malfoid (an m - her signature, sterling scene, and a little drama), Fulgur (a z, like a struck match, play / pause), Serpens (an s, top to bottom, emerald ambient scene), Circulus (circle, clockwise, volume up). Opens the website, where you can draw a spell yourself.</desc><defs><style>
text{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#F6F6F4}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,Menlo,monospace}
.b{font-weight:600}.it{font-style:italic}.body{fill:#C8CDCA}.soft{fill:#8E9692}.faint{fill:#5C635F}
.teal{fill:#42BBC4}.sage{fill:#93B787}.paper{fill:#1A1C1B}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
.flow{stroke-dasharray:1.5 9;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-21}}
.draw{stroke-dasharray:440;animation:draw 6s cubic-bezier(.45,0,.2,1) infinite}@keyframes draw{0%{stroke-dashoffset:440}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.trip{opacity:0;animation:trip 7s ease-in-out infinite}@keyframes trip{0%,10%{opacity:0}18%,72%{opacity:1}86%,100%{opacity:0}}
.bar{animation:bar 1.1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:bottom}@keyframes bar{from{transform:scaleY(0)}}
.grow{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}
.prog{animation:prog 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}@keyframes prog{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}
.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.twinkle{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><pattern id="gp" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M10 0V50M20 0V50M30 0V50M40 0V50M0 10H50M0 20H50M0 30H50M0 40H50" stroke="#202322"/><path d="M.5 0V50M0 .5H50" stroke="#272B29"/></pattern></defs><rect x=".5" y=".5" width="519" height="353" rx="4" fill="#1A1C1B" stroke="#323634"/>
<text x="22" y="32" font-size="11" class="mono" letter-spacing="1.2"><tspan class="teal b">▶ LIVE</tspan><tspan class="soft">  ·  SPELLBOOK</tspan></text>
<text x="22" y="78" font-size="30" class="serif">malfoid</text>
<text x="22" y="101" font-size="14.5" class="serif it soft">Embedded systems</text>
<text x="22" y="134" font-size="13.5" class="body">Draw a spell with your</text>
<text x="22" y="153" font-size="13.5" class="body">mouse or finger. The</text>
<text x="22" y="172" font-size="13.5" class="body">recognizer that runs on the</text>
<text x="22" y="191" font-size="13.5" class="body">wand judges it.</text>
<text x="22" y="222" font-size="12.5" class="body">9 spells, each a 32-point template</text>
<text x="22" y="244" font-size="12.5" class="body">DTW match, on the ESP32-S3</text>
<text x="22" y="266" font-size="12.5" class="body"><tspan class="teal b">99.6%</tspan> top-1 on test casts</text>
<rect x="22" y="290" width="184" height="40" rx="3" fill="#42BBC4"/><text x="114" y="315" font-size="15" class="b" text-anchor="middle" style="fill:#1A1C1B">Cast a spell  ↗</text>
<text x="498" y="318" font-size="9.5" class="mono faint" text-anchor="end">spells/spellbook.json templates</text>
