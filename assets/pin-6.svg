<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" fill="none" role="img" aria-labelledby="t d"><title id="t">malfoid</title><desc id="d">malfoid: ESP32-S3 gesture wand: on-device spell recognition from a 6-axis IMU, haptics, and smart-home control through Home Assistant and MQTT. Key numbers: 99.6% top-1 accuracy on test casts; ~1 ms inference on the ESP32-S3. Status: ACTIVE BUILD. CI success. 1 stars, updated 14 Oct 2026.</desc><defs><style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#f4f0e5}
