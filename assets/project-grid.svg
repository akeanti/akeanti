<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" fill="none" role="img" aria-labelledby="title desc"><title id="title">cascade-gnn | Grid resilience</title><desc id="desc">Graph neural networks for cascading grid failures using PowerGraph, with XGBoost as a baseline, GNNExplainer for model inspection and Streamlit for results. The animated network is an illustrative schematic, not live data.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f6f1}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.2px}
.muted{fill:#b4c0ba}.teal{fill:#43b8c0}.sage{fill:#a3bf94}.gold{fill:#d5bd8f}
.title{font-weight:650;letter-spacing:-.6px}
.flow{animation:flow 16s linear infinite}.flow2{animation:flow 22s linear infinite reverse}
.pulse{animation:pulse 6s ease-in-out infinite}.pulse2{animation:pulse 7s ease-in-out 2s infinite}
.orbit{animation:orbit 40s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit2{animation:orbit 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 8s linear infinite}.rise2{animation:rise 8s linear 3s infinite}
.sweep{animation:sweep 12s ease-in-out infinite}.bloom{animation:bloom 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(12px);opacity:.2}60%{opacity:.8}100%{transform:translateY(-28px);opacity:.15}}
@keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes bloom{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.13);opacity:.75}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.pulse,.pulse2,.orbit,.orbit2,.rise,.rise2,.sweep,.bloom{animation:none!important}}
</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a3bf94" stroke-opacity=".045"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43b8c0" stop-opacity=".06"/><stop offset="1" stop-color="#a3bf94" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="1198" height="266" rx="20" fill="#1a1c1b" stroke="#374640" /><text x="34" y="38" font-size="15" class="mono gold" >01 / GRID RESILIENCE</text><text x="32" y="94" font-size="45" class="title" >cascade-gnn</text><text x="34" y="136" font-size="21" class="muted" >Cascading-failure prediction with graph learning.</text><text x="34" y="171" font-size="17" class="muted" >PowerGraph data · XGBoost baseline · model explanations</text><rect x="34" y="205" width="201" height="30" rx="7" fill="#1a1c1b" stroke="#374640" /><text x="47" y="225" font-size="14" class="mono" style="fill:#43b8c0" >PyTorch Geometric</text><rect x="247" y="205" width="158" height="30" rx="7" fill="#1a1c1b" stroke="#374640" /><text x="260" y="225" font-size="14" class="mono" style="fill:#a3bf94" >GNNExplainer</text><rect x="417" y="205" width="121" height="30" rx="7" fill="#1a1c1b" stroke="#374640" /><text x="430" y="225" font-size="14" class="mono" style="fill:#d5bd8f" >Streamlit</text><line x1="685" y1="28" x2="685" y2="237" stroke="#374640" stroke-width="1" /><text x="939" y="36" font-size="12" class="mono muted" text-anchor="middle">ILLUSTRATIVE GRID</text><g transform="translate(739 48) scale(1)"><line x1="12" y1="84" x2="99" y2="27" stroke="#374640" stroke-width="1.5" /><line x1="12" y1="84" x2="106" y2="134" stroke="#374640" stroke-width="1.5" /><line x1="99" y1="27" x2="205" y2="83" stroke="#374640" stroke-width="1.5" /><line x1="106" y1="134" x2="205" y2="83" stroke="#374640" stroke-width="1.5" /><line x1="205" y1="83" x2="296" y2="28" stroke="#374640" stroke-width="1.5" /><line x1="205" y1="83" x2="306" y2="137" stroke="#374640" st