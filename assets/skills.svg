<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" fill="none" role="img" aria-labelledby="t d"><title id="t">Toolkit, certifications and languages</title><desc id="d">Toolkit. Grids &amp; energy: Power flow (Newton-Raphson), Three-phase, P/Q/S, Power factor, Transformers, N-1 contingency, DC-OPF and LMPs, Synchrophasors, IEEE C37.118, MATPOWER cases. Embedded &amp; measurement: ESP32 and ESP32-S3, C and C++, ESP-IDF, FreeRTOS, PlatformIO, KiCad, MQTT, Oscilloscope, IMUs and sensors, Arduino. Software &amp; tools: Python, MATLAB, Simulink, NumPy, SciPy, PyTorch, XGBoost, SHAP, pytest, Docker, GitHub Actions, Git, Linux, LaTeX. Certifications: Electric Power Systems, University at Buffalo, Coursera; Mobilités et véhicules électriques, École des Ponts ParisTech, Coursera; MATLAB, Simulink and Simscape Onramp, MathWorks. Languages: Arabic (native), French (fluent), English (professional).</desc><defs><style>
text{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#F6F6F4}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,Menlo,monospace}
.b{font-weight:600}.it{font-style:italic}.body{fill:#C8CDCA}.soft{fill:#8E9692}.faint{fill:#5C635F}
.teal{fill:#42BBC4}.sage{fill:#93B787}.paper{fill:#1A1C1B}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
.flow{stroke-dasharray:1.5 9;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-21}}
.draw{stroke-dasharray:440;animation:draw 6s cubic-bezier(.45,0,.2,1) infinite}@keyframes draw{0%{stroke-dashoffset:440}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.trip{opacity:0;animation:trip 7s ease-in-out infinite}@keyframes trip{0%,10%{opacity:0}18%,72%{opacity:1}86%,100%{opacity:0}}
.bar{animation:bar 1.1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:bottom}@keyframes bar{from{transform:scaleY(0)}}
.grow{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}
.prog{animation:prog 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}@keyframes prog{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}
.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.twinkle{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="1199" height="397" rx="4" fill="#1A1C1B" stroke="#323634"/>
