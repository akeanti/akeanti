<text x="832" y="111" font-size="15.5"><tspan>SHAP</tspan><tspan class="faint">  /  </tspan><tspan>pytest</tspan><tspan class="faint">  /  </tspan><tspan>Docker</tspan><tspan class="faint">  /  </tspan><tspan>GitHub Actions</tspan><tspan class="faint">  /  </tspan><tspan>Git</tspan></text>
