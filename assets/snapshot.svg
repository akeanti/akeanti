<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" fill="none" role="img" aria-labelledby="title desc"><title id="title">At a glance</title><desc id="desc">Open to a summer 2027 internship of one to two months. Fields: electrical and energy engineering, industrial AI and OT security. Location: Morocco or abroad, on-site, hybrid or remote. Studying electrical and energy engineering (GEE) at EHTP after CPGE MP and the CNC. Languages: Arabic native, French fluent, English professional.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#22362d}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.2px}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.4px}
.flow-slow{animation:flow 18s linear infinite reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.bar{animation:bar 1.1s cubic-bezier(.6,0,.2,1) both;transform-box:fill-box;transform-origin:left}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes bar{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.flow-slow,.pulse,.ring,.in,.bar{animation:none!important}}
</style><clipPath id="bounds"><rect x="1" y="1" width="1198" height="370" rx="24" fill="white" /></clipPath></defs><rect x="1" y="1" width="1198" height="370" rx="24" fill="#efecdf" stroke="#c5cdbb" /><g clip-path="url(#bounds)">
