<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" fill="none" role="img" aria-labelledby="title desc"><title id="title">Ask me about</title><desc id="desc">Interview starters. One: why a tuned XGBoost can beat a GNN, and what it says about the features. Two: keeping ML results honest with grouped splits, leakage checks and a claim ledger. Three: building a 34 kHz wireless power prototype and comparing it to the Yates reference.</desc><defs><style>
