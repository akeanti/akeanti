<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="t d"><title id="t">Wireless power transfer, TIPE</title><desc id="d">Wireless power transfer, TIPE research project in CPGE, on a physical bench. Two coupled coils, first as a plain RL link, then as RLC circuits tuned to resonance. At 14 cm the tuned link still delivers 13%, against 0.3% untuned. Next step: Litz wire. Key numbers: 23% efficiency at 34 kHz, up from 7.4% on the RL bench; model validated with R squared 0.992; coupling k = 0.044; quality factor Q about 16.9. Tools: RLC coupling, signal generator, oscilloscope, Python. Figure: transmit and receive coils 14 cm apart with their capacitors, and the resonance curve at 34 kHz.</desc><defs><style>
