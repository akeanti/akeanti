<svg width="100%" height="175" viewBox="0 0 900 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolbox: power and energy systems, AI and ML, embedded and OT security">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26,0 H0 V26" fill="none" stroke="#1793D1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="row1clip"><rect x="20" y="33" width="860" height="30" rx="4"/></clipPath>
    <clipPath id="row2clip"><rect x="20" y="79" width="860" height="30" rx="4"/></clipPath>
    <clipPath id="row3clip"><rect x="20" y="125" width="860" height="30" rx="4"/></clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .lbl  { font-family:'JetBrains Mono','SFMono-Regular',monospace; fill:#5c7488; }
      .cat  { font-family:'JetBrains Mono','SFMono-Regular',monospace; font-weight:700; font-size:10.5px; }
      .chip { fill:#0e1c2e; stroke-width:1.2; }
      .pin  { stroke-width:1.6; }
      .ctxt { font-family:'JetBrains Mono','SFMono-Regular',monospace; fill:#e7f1f8; font-size:10.5px; }
      .cont { stroke-width:1.4; stroke-dasharray:1 4; stroke-linecap:round; }
    </style>
  </defs>

  <rect width="900" height="175" rx="12" fill="url(#bg3)"/>
  <rect width="900" height="175" rx="12" fill="url(#grid3)"/>
  <rect x="1" y="1" width="898" height="173" rx="11" fill="none" stroke="#1793D1" stroke-opacity="0.2"/>
  <text x="20" y="18" class="lbl" font-size="10" opacity="0.7">components //</text>

  <!-- POWER &amp; ENERGY -->
  <text x="20" y="52" class="cat" fill="#1793D1">POWER &amp; ENERGY</text>
  <g>
    <line class="pin" x1="154" y1="48" x2="160" y2="48" stroke="#1793D1"/><line class="pin" x1="212" y1="48" x2="218" y2="48" stroke="#1793D1"/>
    <rect class="chip" x="160" y="35" width="52" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
    <text x="186" y="52" text-anchor="middle" class="ctxt">MCSA</text>
    <line class="pin" x1="216" y1="48" x2="222" y2="48" stroke="#1793D1"/><line class="pin" x1="280" y1="48" x2="286" y2="48" stroke="#1793D1"/>
    <rect class="chip" x="222" y="35" width="58" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
    <text x="251" y="52" text-anchor="middle" class="ctxt">pvlib</text>
    <line class="pin" x1="284" y1="48" x2="290" y2="48" stroke="#1793D1"/><line class="pin" x1="336" y1="48" x2="342" y2="48" stroke="#1793D1"/>
    <rect class="chip" x="290" y="35" width="46" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
    <text x="313" y="52" text-anchor="middle" class="ctxt">BMS</text>
    <line class="pin" x1="340" y1="48" x2="346" y2="48" stroke="#1793D1"/><line class="pin" x1="480" y1="48" x2="486" y2="48" stroke="#1793D1"/>
    <rect class="chip" x="346" y="35" width="134" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
    <text x="413" y="52" text-anchor="middle" class="ctxt">Resonant Coupling</text>
    <line class="cont" x1="490" y1="48" x2="856" y2="48" stroke="#1793D1" stroke-opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <circle cx="860" cy="48" r="3" fill="#1793D1" filter="url(#glow3)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g clip-path="url(#row1clip)">
    <rect x="20" y="33" width="3" height="30" fill="#1793D1" opacity="0.4" filter="url(#glow3)">
      <animate attributeName="x" values="20;877;20" keyTimes="0;0.5;1" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- AI / ML -->
  <text x="20" y="98" class="cat" fill="#ffb300">AI / ML</text>
  <g>
    <line class="pin" x1="154" y1="94" x2="160" y2="94" stroke="#ffb300"/><line class="pin" x1="230" y1="94" x2="236" y2="94" stroke="#ffb300"/>
    <rect class="chip" x="160" y="81" width="70" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
    <text x="195" y="98" text-anchor="middle" class="ctxt">PyTorch</text>
    <line class="pin" x1="234" y1="94" x2="240" y2="94" stroke="#ffb300"/><line class="pin" x1="310" y1="94" x2="316" y2="94" stroke="#ffb300"/>
    <rect class="chip" x="240" y="81" width="70" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
    <text x="275" y="98" text-anchor="middle" class="ctxt">XGBoost</text>
    <line class="pin" x1="314" y1="94" x2="320" y2="94" stroke="#ffb300"/><line class="pin" x1="372" y1="94" x2="378" y2="94" stroke="#ffb300"/>
    <rect class="chip" x="320" y="81" width="52" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
    <text x="346" y="98" text-anchor="middle" class="ctxt">SHAP</text>
    <line class="pin" x1="376" y1="94" x2="382" y2="94" stroke="#ffb300"/><line class="pin" x1="446" y1="94" x2="452" y2="94" stroke="#ffb300"/>
    <rect class="chip" x="382" y="81" width="64" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
    <text x="414" y="98" text-anchor="middle" class="ctxt">Optuna</text>
    <line class="pin" x1="450" y1="94" x2="456" y2="94" stroke="#ffb300"/><line class="pin" x1="508" y1="94" x2="514" y2="94" stroke="#ffb300"/>
    <rect class="chip" x="456" y="81" width="52" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
    <text x="482" y="98" text-anchor="middle" class="ctxt">GNNs</text>
    <line class="cont" x1="518" y1="94" x2="856" y2="94" stroke="#ffb300" stroke-opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="860" cy="94" r="3" fill="#ffb300" filter="url(#glow3)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g clip-path="url(#row2clip)">
    <rect x="20" y="79" width="3" height="30" fill="#ffb300" opacity="0.4" filter="url(#glow3)">
      <animate attributeName="x" values="20;877;20" keyTimes="0;0.5;1" dur="6.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- EMBEDDED / OT-SEC -->
  <text x="20" y="144" class="cat" fill="#3ddc84">EMBEDDED / OT-SEC</text>
  <g>
    <line class="pin" x1="154" y1="140" x2="160" y2="140" stroke="#3ddc84"/><line class="pin" x1="218" y1="140" x2="224" y2="140" stroke="#3ddc84"/>
    <rect class="chip" x="160" y="127" width="58" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
    <text x="189" y="144" text-anchor="middle" class="ctxt">ESP32</text>
    <line class="pin" x1="222" y1="140" x2="228" y2="140" stroke="#3ddc84"/><line class="pin" x1="298" y1="140" x2="304" y2="140" stroke="#3ddc84"/>
    <rect class="chip" x="228" y="127" width="70" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
    <text x="263" y="144" text-anchor="middle" class="ctxt">Arduino</text>
    <line class="pin" x1="302" y1="140" x2="308" y2="140" stroke="#3ddc84"/><line class="pin" x1="366" y1="140" x2="372" y2="140" stroke="#3ddc84"/>
    <rect class="chip" x="308" y="127" width="58" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
    <text x="337" y="144" text-anchor="middle" class="ctxt">SCADA</text>
    <line class="pin" x1="370" y1="140" x2="376" y2="140" stroke="#3ddc84"/><line class="pin" x1="422" y1="140" x2="428" y2="140" stroke="#3ddc84"/>
    <rect class="chip" x="376" y="127" width="46" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
    <text x="399" y="144" text-anchor="middle" class="ctxt">CEH</text>
    <line class="pin" x1="426" y1="140" x2="432" y2="140" stroke="#3ddc84"/><line class="pin" x1="486" y1="140" x2="492" y2="140" stroke="#3ddc84"/>
    <rect class="chip" x="432" y="127" width="54" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
    <text x="459" y="144" text-anchor="middle" class="ctxt">Nmap</text>
    <line class="cont" x1="496" y1="140" x2="856" y2="140" stroke="#3ddc84" stroke-opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.9s" repeatCount="indefinite"/>
    </line>
    <circle cx="860" cy="140" r="3" fill="#3ddc84" filter="url(#glow3)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g clip-path="url(#row3clip)">
    <rect x="20" y="125" width="3" height="30" fill="#3ddc84" opacity="0.4" filter="url(#glow3)">
      <animate attributeName="x" values="20;877;20" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
