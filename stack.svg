<svg width="100%" height="215" viewBox="0 0 900 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolbox: power and energy systems, AI and ML, embedded and OT security, platforms and tools">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26,0 H0 V26" fill="none" stroke="#1793D1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .lbl  { font-family:'JetBrains Mono','SFMono-Regular',monospace; fill:#5c7488; }
      .cat  { font-family:'JetBrains Mono','SFMono-Regular',monospace; font-weight:700; font-size:10.5px; }
      .chip { fill:#0e1c2e; stroke-width:1.2; }
      .pin  { stroke-width:1.6; }
      .ctxt { font-family:'JetBrains Mono','SFMono-Regular',monospace; fill:#e7f1f8; font-size:10.5px; }
      .cont { stroke-width:1.2; stroke-dasharray:1 4; stroke-linecap:round; }
      .ico  { fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="900" height="215" rx="12" fill="url(#bg3)"/>
  <rect width="900" height="215" rx="12" fill="url(#grid3)"/>
  <rect x="1" y="1" width="898" height="213" rx="11" fill="none" stroke="#1793D1" stroke-opacity="0.2"/>
  <text x="20" y="18" class="lbl" font-size="10" opacity="0.7">components //</text>
  <text x="880" y="18" text-anchor="end" class="lbl" font-size="9" opacity="0.5">rev.4</text>

  <!-- POWER & ENERGY : oscilloscope trace icon -->
  <g transform="translate(20,42)">
    <rect class="ico" x="0" y="0" width="15" height="15" rx="2.5" stroke="#1793D1" stroke-opacity="0.75"/>
    <path class="ico" d="M2,10 L5,10 L6.5,4 L8.5,13 L10,7 L13,7" stroke="#1793D1"/>
  </g>
  <text x="42" y="56" class="cat" fill="#1793D1">POWER &amp; ENERGY</text>
  <line class="pin" x1="154" y1="52" x2="160" y2="52" stroke="#1793D1"/>
  <rect class="chip" x="160" y="39" width="54" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
  <text x="187" y="56" text-anchor="middle" class="ctxt">MCSA</text>
  <line class="pin" x1="214" y1="52" x2="220" y2="52" stroke="#1793D1"/>
  <rect class="chip" x="220" y="39" width="60" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
  <text x="250" y="56" text-anchor="middle" class="ctxt">pvlib</text>
  <line class="pin" x1="280" y1="52" x2="286" y2="52" stroke="#1793D1"/>
  <rect class="chip" x="286" y="39" width="48" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
  <text x="310" y="56" text-anchor="middle" class="ctxt">BMS</text>
  <line class="pin" x1="334" y1="52" x2="340" y2="52" stroke="#1793D1"/>
  <rect class="chip" x="340" y="39" width="72" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
  <text x="376" y="56" text-anchor="middle" class="ctxt">ADS1115</text>
  <line class="pin" x1="412" y1="52" x2="418" y2="52" stroke="#1793D1"/>
  <rect class="chip" x="418" y="39" width="136" height="26" rx="6" stroke="#1793D1" stroke-opacity="0.6"/>
  <text x="486" y="56" text-anchor="middle" class="ctxt">Resonant Coupling</text>
  <line class="cont" x1="560" y1="52" x2="856" y2="52" stroke="#1793D1" stroke-opacity="0.3"/>
  <circle cx="860" cy="52" r="3" fill="#1793D1" filter="url(#glow3)"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>

  <!-- AI / ML : network graph icon -->
  <g transform="translate(20,86)">
    <line class="ico" x1="2" y1="12" x2="8" y2="3" stroke="#ffb300"/>
    <line class="ico" x1="8" y1="3" x2="14" y2="11" stroke="#ffb300"/>
    <line class="ico" x1="2" y1="12" x2="14" y2="11" stroke="#ffb300"/>
    <circle cx="2" cy="12" r="1.6" fill="#ffb300"/><circle cx="8" cy="3" r="1.6" fill="#ffb300"/><circle cx="14" cy="11" r="1.6" fill="#ffb300"/>
  </g>
  <text x="42" y="100" class="cat" fill="#ffb300">AI / ML</text>
  <line class="pin" x1="154" y1="96" x2="160" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="160" y="83" width="72" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="196" y="100" text-anchor="middle" class="ctxt">PyTorch</text>
  <line class="pin" x1="232" y1="96" x2="238" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="238" y="83" width="72" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="274" y="100" text-anchor="middle" class="ctxt">XGBoost</text>
  <line class="pin" x1="310" y1="96" x2="316" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="316" y="83" width="54" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="343" y="100" text-anchor="middle" class="ctxt">SHAP</text>
  <line class="pin" x1="370" y1="96" x2="376" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="376" y="83" width="66" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="409" y="100" text-anchor="middle" class="ctxt">Optuna</text>
  <line class="pin" x1="442" y1="96" x2="448" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="448" y="83" width="54" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="475" y="100" text-anchor="middle" class="ctxt">GNNs</text>
  <line class="pin" x1="502" y1="96" x2="508" y2="96" stroke="#ffb300"/>
  <rect class="chip" x="508" y="83" width="66" height="26" rx="6" stroke="#ffb300" stroke-opacity="0.6"/>
  <text x="541" y="100" text-anchor="middle" class="ctxt">pandas</text>
  <line class="cont" x1="580" y1="96" x2="856" y2="96" stroke="#ffb300" stroke-opacity="0.3"/>
  <circle cx="860" cy="96" r="3" fill="#ffb300" filter="url(#glow3)"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>

  <!-- EMBEDDED / OT-SEC : IC chip icon -->
  <g transform="translate(20,130)">
    <rect class="ico" x="3" y="3" width="9" height="9" rx="1" stroke="#3ddc84"/>
    <line class="ico" x1="0" y1="5" x2="3" y2="5" stroke="#3ddc84"/><line class="ico" x1="0" y1="9" x2="3" y2="9" stroke="#3ddc84"/>
    <line class="ico" x1="12" y1="5" x2="15" y2="5" stroke="#3ddc84"/><line class="ico" x1="12" y1="9" x2="15" y2="9" stroke="#3ddc84"/>
    <line class="ico" x1="5" y1="0" x2="5" y2="3" stroke="#3ddc84"/><line class="ico" x1="9" y1="0" x2="9" y2="3" stroke="#3ddc84"/>
  </g>
  <text x="42" y="144" class="cat" fill="#3ddc84">EMBEDDED / OT-SEC</text>
  <line class="pin" x1="154" y1="140" x2="160" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="160" y="127" width="60" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="190" y="144" text-anchor="middle" class="ctxt">ESP32</text>
  <line class="pin" x1="220" y1="140" x2="226" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="226" y="127" width="72" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="262" y="144" text-anchor="middle" class="ctxt">Arduino</text>
  <line class="pin" x1="298" y1="140" x2="304" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="304" y="127" width="60" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="334" y="144" text-anchor="middle" class="ctxt">SCADA</text>
  <line class="pin" x1="364" y1="140" x2="370" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="370" y="127" width="48" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="394" y="144" text-anchor="middle" class="ctxt">CEH</text>
  <line class="pin" x1="418" y1="140" x2="424" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="424" y="127" width="54" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="451" y="144" text-anchor="middle" class="ctxt">Nmap</text>
  <line class="pin" x1="478" y1="140" x2="484" y2="140" stroke="#3ddc84"/>
  <rect class="chip" x="484" y="127" width="86" height="26" rx="6" stroke="#3ddc84" stroke-opacity="0.6"/>
  <text x="527" y="144" text-anchor="middle" class="ctxt">Wireshark</text>
  <line class="cont" x1="576" y1="140" x2="856" y2="140" stroke="#3ddc84" stroke-opacity="0.3"/>
  <circle cx="860" cy="140" r="3" fill="#3ddc84" filter="url(#glow3)"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>

  <!-- PLATFORMS & TOOLS : terminal icon -->
  <g transform="translate(20,174)">
    <rect class="ico" x="0" y="0" width="15" height="15" rx="2" stroke="#c792ea" stroke-opacity="0.75"/>
    <path class="ico" d="M3,5 L6,7.5 L3,10" stroke="#c792ea"/>
    <line class="ico" x1="7.5" y1="10" x2="12" y2="10" stroke="#c792ea"/>
  </g>
  <text x="42" y="188" class="cat" fill="#c792ea">PLATFORMS &amp; TOOLS</text>
  <line class="pin" x1="154" y1="184" x2="160" y2="184" stroke="#c792ea"/>
  <rect class="chip" x="160" y="171" width="48" height="26" rx="6" stroke="#c792ea" stroke-opacity="0.6"/>
  <text x="184" y="188" text-anchor="middle" class="ctxt">Git</text>
  <line class="pin" x1="208" y1="184" x2="214" y2="184" stroke="#c792ea"/>
  <rect class="chip" x="214" y="171" width="60" height="26" rx="6" stroke="#c792ea" stroke-opacity="0.6"/>
  <text x="244" y="188" text-anchor="middle" class="ctxt">Linux</text>
  <line class="pin" x1="274" y1="184" x2="280" y2="184" stroke="#c792ea"/>
  <rect class="chip" x="280" y="171" width="60" height="26" rx="6" stroke="#c792ea" stroke-opacity="0.6"/>
  <text x="310" y="188" text-anchor="middle" class="ctxt">LaTeX</text>
  <line class="pin" x1="340" y1="184" x2="346" y2="184" stroke="#c792ea"/>
  <rect class="chip" x="346" y="171" width="72" height="26" rx="6" stroke="#c792ea" stroke-opacity="0.6"/>
  <text x="382" y="188" text-anchor="middle" class="ctxt">VS Code</text>
  <line class="cont" x1="424" y1="184" x2="856" y2="184" stroke="#c792ea" stroke-opacity="0.3"/>
  <circle cx="860" cy="184" r="3" fill="#c792ea" filter="url(#glow3)"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
</svg>
