<svg width="100%" height="175" viewBox="0 0 900 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolbox: power and energy systems, AI and ML, embedded and OT security">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#13293d"/>
    </linearGradient>
    <style>
      .lbl  { font-family:'JetBrains Mono','Fira Code',monospace; fill:#5c7488; }
      .cat  { font-family:'JetBrains Mono','Fira Code',monospace; font-weight:700; font-size:10.5px; }
      .chip { fill:#101f30; stroke-width:1.2; }
      .pin  { stroke-width:1.6; }
      .ctxt { font-family:'JetBrains Mono','Fira Code',monospace; fill:#e7f1f8; font-size:10.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="175" rx="12" fill="url(#bg3)"/>
  <rect x="1" y="1" width="898" height="173" rx="11" fill="none" stroke="#1793D1" stroke-opacity="0.2"/>
  <text x="20" y="18" class="lbl" font-size="10" opacity="0.7">components //</text>

  <text x="20" y="52" class="cat" fill="#1793D1">POWER &amp; ENERGY</text>
  <g>
