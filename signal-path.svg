<svg width="100%" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signal path from field data to decision support, with a continuous monitoring feedback loop">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26,0 H0 V26" fill="none" stroke="#1793D1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c7488"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ddc84" fill-opacity="0.8"/>
    </marker>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .lbl   { font-family:'JetBrains Mono','SFMono-Regular',monospace; fill:#5c7488; }
      .node  { fill:#0e1c2e; stroke:#1793D1; stroke-opacity:0.4; stroke-width:1.2; }
      .leg   { stroke:#3a4a5c; stroke-width:2; }
      .conn  { stroke:#5c7488; stroke-width:1.5; }
      .idx   { font-family:'JetBrains Mono',monospace; fill:#4a6076; font-size:8; }
      .ttl   { font-family:'JetBrains Mono',monospace; font-weight:700; fill:#f2f7fb; font-size:13; }
      .sub   { font-family:'JetBrains Mono',monospace; fill:#8fb8d6; font-size:9; }
      .draw  { stroke-dasharray:120; stroke-dashoffset:120; fill:none; }
    </style>
  </defs>

  <rect width="900" height="170" rx="12" fill="url(#bg2)"/>
  <rect width="900" height="170" rx="12" fill="url(#grid2)"/>
  <rect x="1" y="1" width="898" height="168" rx="11" fill="none" stroke="#1793D1" stroke-opacity="0.2"/>
  <text x="20" y="18" class="lbl" font-size="10" opacity="0.7">signal path // field to decision</text>

  <!-- connectors, drawn in sequence -->
  <line class="conn draw" pathLength="120" x1="160" y1="75" x2="196" y2="75" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.35s" begin="0.5s" fill="freeze"/>
  </line>
  <line class="conn draw" pathLength="120" x1="340" y1="75" x2="376" y2="75" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.35s" begin="1.35s" fill="freeze"/>
  </line>
  <line class="conn draw" pathLength="120" x1="520" y1="75" x2="556" y2="75" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.35s" begin="2.2s" fill="freeze"/>
  </line>
  <line class="conn draw" pathLength="120" x1="700" y1="75" x2="736" y2="75" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.35s" begin="3.05s" fill="freeze"/>
  </line>

  <!-- feedback loop: decision informs the next sensing pass -->
  <path class="draw" pathLength="120" d="M770,116 V148 H310 V116" stroke="#3ddc84" stroke-opacity="0.55" stroke-width="1.4"
        stroke-dasharray="120" marker-end="url(#arrowLoop)">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.1s" begin="4s" fill="freeze"/>
  </path>
  <text x="540" y="162" text-anchor="middle" class="lbl" font-size="9" opacity="0" >continuous monitoring, not a one-shot check
    <animate attributeName="opacity" from="0" to="0.85" dur="0.5s" begin="4.9s" fill="freeze"/>
  </text>

  <!-- 01 FIELD -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0s" fill="freeze"/>
    <line class="leg" x1="50" y1="40" x2="50" y2="34"/><line class="leg" x1="130" y1="40" x2="130" y2="34"/>
    <line class="leg" x1="50" y1="110" x2="50" y2="116"/><line class="leg" x1="130" y1="110" x2="130" y2="116"/>
    <rect class="node" x="20" y="40" width="140" height="70" rx="6"/>
    <circle cx="150" cy="55" r="7" fill="none" stroke="#1793D1" stroke-width="1.4" filter="url(#glow2)"/>
    <circle cx="150" cy="55" r="2" fill="#1793D1"/>
    <text x="30" y="58" class="idx">01</text>
    <text x="90" y="76" text-anchor="middle" class="ttl">FIELD</text>
    <text x="90" y="99" text-anchor="middle" class="sub">motors · grids</text>
  </g>

  <!-- 02 SENSE -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.85s" fill="freeze"/>
    <line class="leg" x1="230" y1="40" x2="230" y2="34"/><line class="leg" x1="310" y1="40" x2="310" y2="34"/>
    <line class="leg" x1="230" y1="110" x2="230" y2="116"/><line class="leg" x1="310" y1="110" x2="310" y2="116"/>
    <rect class="node" x="200" y="40" width="140" height="70" rx="6"/>
    <rect x="322" y="49.5" width="16" height="11" rx="2" fill="none" stroke="#3ddc84" stroke-width="1.3" filter="url(#glow2)"/>
    <line x1="326" y1="49.5" x2="326" y2="46" stroke="#3ddc84" stroke-width="1.2"/>
    <line x1="334" y1="49.5" x2="334" y2="46" stroke="#3ddc84" stroke-width="1.2"/>
    <line x1="326" y1="60.5" x2="326" y2="64" stroke="#3ddc84" stroke-width="1.2"/>
    <line x1="334" y1="60.5" x2="334" y2="64" stroke="#3ddc84" stroke-width="1.2"/>
    <text x="210" y="58" class="idx">02</text>
    <text x="270" y="76" text-anchor="middle" class="ttl">SENSE</text>
    <text x="270" y="99" text-anchor="middle" class="sub">ESP32 · ADS1115</text>
  </g>

  <!-- 03 MODEL -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.7s" fill="freeze"/>
    <line class="leg" x1="410" y1="40" x2="410" y2="34"/><line class="leg" x1="490" y1="40" x2="490" y2="34"/>
    <line class="leg" x1="410" y1="110" x2="410" y2="116"/><line class="leg" x1="490" y1="110" x2="490" y2="116"/>
    <rect class="node" x="380" y="40" width="140" height="70" rx="6"/>
    <g filter="url(#glow2)">
      <line x1="503" y1="60" x2="510" y2="49" stroke="#ffb300" stroke-width="1.2"/>
      <line x1="510" y1="49" x2="517" y2="60" stroke="#ffb300" stroke-width="1.2"/>
      <line x1="503" y1="60" x2="517" y2="60" stroke="#ffb300" stroke-width="1.2"/>
      <circle cx="503" cy="60" r="2" fill="#ffb300"/><circle cx="510" cy="49" r="2" fill="#ffb300"/><circle cx="517" cy="60" r="2" fill="#ffb300"/>
    </g>
    <text x="390" y="58" class="idx">03</text>
    <text x="450" y="76" text-anchor="middle" class="ttl">MODEL</text>
    <text x="450" y="99" text-anchor="middle" class="sub">XGBoost · GNN</text>
  </g>

  <!-- 04 SHIP -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="2.55s" fill="freeze"/>
    <line class="leg" x1="590" y1="40" x2="590" y2="34"/><line class="leg" x1="670" y1="40" x2="670" y2="34"/>
    <line class="leg" x1="590" y1="110" x2="590" y2="116"/><line class="leg" x1="670" y1="110" x2="670" y2="116"/>
    <rect class="node" x="560" y="40" width="140" height="70" rx="6"/>
    <g filter="url(#glow2)">
      <path d="M690,46 L697,60 L683,60 Z" fill="none" stroke="#ffb300" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="690" y1="60" x2="690" y2="65" stroke="#ffb300" stroke-width="1.3"/>
    </g>
    <text x="570" y="58" class="idx">04</text>
    <text x="630" y="76" text-anchor="middle" class="ttl">SHIP</text>
    <text x="630" y="99" text-anchor="middle" class="sub">Streamlit</text>
  </g>

  <!-- 05 DECIDE -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="3.4s" fill="freeze"/>
    <line class="leg" x1="770" y1="40" x2="770" y2="34"/><line class="leg" x1="850" y1="40" x2="850" y2="34"/>
    <line class="leg" x1="770" y1="110" x2="770" y2="116"/><line class="leg" x1="850" y1="110" x2="850" y2="116"/>
    <rect class="node" x="740" y="40" width="140" height="70" rx="6"/>
    <g filter="url(#glow2)">
      <path d="M870,47 L879,55 L870,63 L861,55 Z" fill="none" stroke="#1793D1" stroke-width="1.3"/>
      <circle cx="870" cy="55" r="1.8" fill="#1793D1"/>
    </g>
    <text x="750" y="58" class="idx">05</text>
    <text x="810" y="76" text-anchor="middle" class="ttl">DECIDE</text>
    <text x="810" y="99" text-anchor="middle" class="sub">early warning</text>
  </g>

  <!-- steady status pulse on final node, stationary -->
  <circle cx="870" cy="55" r="1.8" fill="none" stroke="#1793D1" stroke-width="1" opacity="0">
    <animate attributeName="r" values="1.8;9;1.8" dur="2.6s" begin="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" begin="5.4s" repeatCount="indefinite"/>
  </circle>
</svg>
