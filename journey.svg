<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-labelledby="title desc"><title id="title">From curiosity to engineering</title><desc id="desc">At six: opened dad’s old PC. CPGE MP: mathematics and physics. TIPE: wireless-power experiments. EHTP: electrical and energy engineering. Today: grids and PEM diagnostics. Stages are not plotted to a time scale.</desc><defs><style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f0e5}
.serif{font-family:Georgia,Times New Roman,serif;letter-spacing:-1.7px}
.mono{font-family:Consolas,Liberation Mono,monospace;letter-spacing:1.4px}
.bold{font-weight:650;letter-spacing:-.7px}
.flow{animation:flow 10s linear infinite}.flow-slow{animation:flow 18s linear infinite reverse}
.orbit{animation:orbit 30s linear infinite;transform-box:fill-box;transform-origin:center}
.counter{animation:orbit 42s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.float{animation:float 7s ease-in-out infinite}.lift{animation:lift 9s ease-in-out infinite}
.pulse{animation:pulse 5s ease-in-out infinite}.pulse-late{animation:pulse 6s ease-in-out 2s infinite}
.shimmer{animation:shimmer 12s ease-in-out infinite}.rise{animation:rise 8s linear infinite}
.ring{animation:ring 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes lift{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-12px)}}
@keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
@keyframes shimmer{0%,45%{transform:translateX(-340px);opacity:0}55%{opacity:.25}80%,100%{transform:translateX(340px);opacity:0}}
@keyframes rise{0%{transform:translateY(8px);opacity:.25}60%{opacity:.8}100%{transform:translateY(-23px);opacity:.1}}
@keyframes ring{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.09);opacity:.85}}
@media(prefers-reduced-motion:reduce){.flow,.flow-slow,.orbit,.counter,.float,.lift,.pulse,.pulse-late,.shimmer,.rise,.ring{animation:none!important}}

.scan{animation:scan 7s linear infinite}.rock{animation:rock 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rotor{animation:orbit 18s linear infinite;transform-origin:0px 0px}
.drift{animation:drift 11s ease-in-out infinite}.dash{animation:flow 7s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(204px)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.scan,.rock,.rotor,.drift,.dash{animation:none!important}}
</style><clipPath id="bounds"><rect x="1" y="1" width="1198" height="258" rx="24" fill="white" /></clipPath></defs><rect x="1" y="1" width="1198" height="258" rx="24" fill="#181e1c" stroke="#3b4a42" /><g clip-path="url(#bounds)"><text x="34" y="58" font-size="36" class="serif" style="fill:#f4f0e5" >The thread that connects it.</text><line x1="48" y1="133" x2="1132" y2="133" stroke="#3b4a42" stroke-width="1.5" /><path d="M48 133H1132" fill="none" stroke="#48bfc4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 110" class="flow"/><text x="34" y="106" font-size="15" class="mono" style="fill:#b7cd91" >AGE SIX</text><circle cx="44" cy="133" r="6" fill="#181e1c" stroke="#48bfc4" stroke-width="1.5"/><text x="34" y="184" font-size="28" class="serif" style="fill:#f4f0e5" >The old PC</text><text x="34" y="222" font-size="17" class="" style="fill:#b8c5b9" >Curiosity about electronics</text><text x="268" y="106" font-size="15" class="mono" style="fill:#b7cd91" >CPGE MP</text><circle cx="278" cy="133" r="6" fill="#181e1c" stroke="#48bfc4" stroke-width="1.5"/><text x="268" y="184" font-size="28" class="serif" style="fill:#f4f0e5" >Foundations</text><text x="268" y="222" font-size="17" class="" style="fill:#b8c5b9" >Mathematics &amp; physics</text><text x="502" y="106" font-size="15" class="mono" style="fill:#b7cd91" >TIPE</text><circle cx="512" cy="133" r="6" fill="#181e1c" stroke="#48bfc4" stroke-width="1.5"/><text x="502" y="184" font-size="28" class="serif" style="fill:#f4f0e5" >The bench</text><text x="502" y="222" font-size="17" class="" style="fill:#b8c5b9" >Resonant wireless power</text><text x="736" y="106" font-size="15" class="mono" style="fill:#b7cd91" >EHTP</text><circle cx="746" cy="133" r="6" fill="#181e1c" stroke="#48bfc4" stroke-width="1.5"/><text x="736" y="184" font-size="28" class="serif" style="fill:#f4f0e5" >Engineering</text><text x="736" y="222" font-size="18" class="" style="fill:#b8c5b9" >Electrical &amp; energy</text><text x="970" y="106" font-size="15" class="mono" style="fill:#b7cd91" >TODAY</text><circle cx="980" cy="133" r="6" fill="#181e1c" stroke="#48bfc4" stroke-width="1.5"/><text x="970" y="184" font-size="28" class="serif" style="fill:#f4f0e5" >Current work</text><text x="970" y="222" font-size="17" class="" style="fill:#b8c5b9" >Grids · PEM diagnostics</text></g></svg>