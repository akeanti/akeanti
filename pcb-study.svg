" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 27" class="flow"/><rect x="71" y="56" width="61" height="58" rx="2" fill="#22362d" /><rect x="83" y="67" width="37" height="35" rx="1" fill="#b7cd91" /><rect x="27" y="96" width="11" height="31" rx="1" fill="#d4dabb" stroke="#22362d" /><rect x="45" y="96" width="11" height="31" rx="1" fill="#d4dabb" stroke="#22362d" /><rect x="151" y="96" width="11" height="31" rx="1" fill="#d4dabb" stroke="#22362d" /><rect x="169" y="96" width="11" height="31" rx="1" fill="#d4dabb" stroke="#22362d" /><path d="M14 133h155v-21M15 119h30V68" fill="none" stroke="#22362d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="drift"><polygon points="109,85 160,61 220,88 169,113" fill="#181e1c" stroke="#48bfc4" /><polygon points="123,85 160,69 206,89 169,104" fill="#48bfc4" /></g><path d="M109 85v24M220 88v23M169 113v22" fill="none" stroke="#22362d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/></g><line x1="34" y1="529" x2="566" y2="529" stroke="#3b4a42" stroke-width="1" /><text x="35" y="571" font-size="20" class="bold" style="fill:#f4f0e5" >Following the copper</text><g transform="translate(543 550) scale(0.9)" ><path d="M0 20 20 0M4 0h16v16" fill="none" stroke="#f4f0e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>